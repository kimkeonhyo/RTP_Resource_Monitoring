[package]
name = "rtpulse"
version = "0.6.0"
edition = "2024"
description = "Real-time RTP/RTSP stream health monitor for your terminal"

[dependencies]
# TUI
ratatui = "0.28"
crossterm = "0.28"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Networking
bytes = "1"
url = "2"
mio = { version = "1", features = ["net", "os-poll"] }
socket2 = { version = "0.5", features = ["all"] }

# Optional: packet capture for discover command (requires libpcap-dev)
pcap = { version = "2", optional = true }
pnet = { version = "0.35", optional = true }

# HTTP client for webhooks
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# HTTP API server
axum = { version = "0.7", features = ["json"] }
tower-http = { version = "0.5", features = ["cors"] }

# Time & utilities
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
md5 = "0.7"
tracing = "0.1"
tracing-subscriber = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
rust_xlsxwriter = "0.80"

[features]
default = []
# Enable pcap-based features (discover + capture monitoring). Requires libpcap-dev.
pcap-capture = ["pcap", "pnet"]
# Alias for backwards compatibility
discover = ["pcap-capture"]

[profile.release]
opt-level = 3
lto = true
