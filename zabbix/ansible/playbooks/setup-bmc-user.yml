---
- name: Create BMC monitoring user
  hosts: ims
  become: true
  # 카나리 배포: 먼저 1대 → 문제없으면 2대 → 나머지 전체.
  # BMC 는 서버가 멈췄을 때 쓰는 마지막 통로라, 한 번에 전부 바꾸지 않는다.
  serial: [1, 2, "100%"]
  max_fail_percentage: 0        # 한 대라도 실패하면 다음 배치로 넘어가지 않는다
  # 비밀번호는 Vault 에 고정한다. 매번 프롬프트로 받으면 7대에 서로 다른 값이 들어가고,
  # Zabbix 매크로({$IPMI.PASSWORD})와도 어긋난다.
  #   ansible-vault edit inventory/ims/group_vars/all/vault.yml
  #   bmc_password: "..."
  roles:
    - bmc-user
