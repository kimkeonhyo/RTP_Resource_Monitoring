# IMS — NVIDIA GPU 지표 (nvidia-smi 파싱)
# gpu.discovery 가 GPU 목록을 JSON으로 내보내면 Zabbix LLD가 GPU 개수만큼 아이템을 만든다.
# nvidia-smi 는 드라이버가 없으면 에러 문구를 stdout 으로 낸다. 그대로 통과시키면
# 그 문장이 GPU 이름이 되어 엉뚱한 아이템이 만들어진다 — 숫자 인덱스만 받는다.
UserParameter=gpu.discovery,nvidia-smi --query-gpu=index,name --format=csv,noheader 2>/dev/null | awk -F', ' 'BEGIN{printf "["} $1 ~ /^[0-9]+$/ {printf "%s{\"{#GPUID}\":\"%s\",\"{#GPUNAME}\":\"%s\"}", (n++?",":""), $1, $2} END{print "]"}'
UserParameter=gpu.util[*],nvidia-smi -i $1 --query-gpu=utilization.gpu --format=csv,noheader,nounits
UserParameter=gpu.temp[*],nvidia-smi -i $1 --query-gpu=temperature.gpu --format=csv,noheader,nounits
UserParameter=gpu.mem.used[*],nvidia-smi -i $1 --query-gpu=memory.used --format=csv,noheader,nounits
UserParameter=gpu.mem.total[*],nvidia-smi -i $1 --query-gpu=memory.total --format=csv,noheader,nounits
UserParameter=gpu.power[*],nvidia-smi -i $1 --query-gpu=power.draw --format=csv,noheader,nounits
