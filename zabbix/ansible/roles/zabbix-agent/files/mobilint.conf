# IMS — Mobilint ARIES NPU (mblt-status 파싱)
#
# 장치당 항목마다 명령을 실행하면 8장 x 5항목 = 분당 40회가 된다.
# npu.stats 가 한 번에 전부 JSON 으로 내고, Zabbix 종속 아이템이 그것을 쪼갠다.
UserParameter=npu.discovery,mblt-status -L 2>/dev/null | awk '$1 ~ /^\/dev\//{n=$1; gsub(/[^0-9]/,"",n); printf "%s{\"{#NPUID}\":\"%s\",\"{#NPUNAME}\":\"%s\"}", (c++?",":"["), n, $2} END{if(c) print "]"; else print "[]"}'
UserParameter=npu.stats,/etc/zabbix/npu-stats.py
