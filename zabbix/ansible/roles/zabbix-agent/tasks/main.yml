---
- name: Ubuntu 인지 확인
  ansible.builtin.assert:
    that: ansible_distribution == 'Ubuntu'
    fail_msg: "이 롤은 Ubuntu 전용입니다 (현재: {{ ansible_distribution }})"

# 인덱스가 낡으면 404가 난다 (gpusystem 에서 실제로 겪은 문제).
# 단, apt 모듈은 서드파티 저장소 하나라도 실패하면 태스크를 실패로 처리한다.
# 실제로 k8s(키 만료)·Chrome(키 없음)·Helm(인증서) 저장소가 깨진 서버들이 있는데,
# 우리가 필요한 건 Zabbix 저장소뿐이므로 갱신 실패는 넘기고 설치 단계에서 판단한다.
- name: apt 인덱스 갱신
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 300   # unattended-upgrades 가 락을 잡고 있으면 기다린다 (기본 60초로는 부족)
  register: apt_update
  failed_when: false

- name: 일부 저장소 갱신 실패 안내 (설치에 영향 없으면 무시 가능)
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }} — apt 인덱스 갱신이 일부 실패했습니다.
      Zabbix 저장소가 정상이면 설치는 진행됩니다. 깨진 저장소는 별도 정리가 필요합니다.
  when: apt_update.failed | default(false) or apt_update.msg is defined

- name: Zabbix 저장소 등록 여부 확인
  ansible.builtin.stat:
    path: /etc/apt/sources.list.d/zabbix.list
  register: zbx_repo

- name: zabbix-release 설치
  ansible.builtin.apt:
    deb: "{{ zabbix_release_url }}"
    lock_timeout: 300   # unattended-upgrades 가 락을 잡고 있으면 기다린다 (기본 60초로는 부족)
  when: not zbx_repo.stat.exists
  notify: refresh apt cache

- name: 저장소 추가 직후 인덱스 반영
  ansible.builtin.meta: flush_handlers

# 깨진 서드파티 저장소 때문에 apt update 가 실패하면 Zabbix 목록도 받아오지 못한다.
# 그 상태로 설치하면 "No package matching" 만 나와 원인을 알 수 없다 — 미리 판별해 원인을 찍는다.
# LC_ALL=C 가 없으면 한국어 로케일에서 'Candidate:' 가 '후보:' 로 나와 판정이 어긋난다.
- name: zabbix-agent2 를 조회할 수 있는지 확인
  ansible.builtin.command: apt-cache policy zabbix-agent2
  environment:
    LC_ALL: C
  register: zbx_policy
  changed_when: false
  failed_when: false
  check_mode: false

- name: 저장소 문제로 설치 불가
  when:
    - not ansible_check_mode
    - "'Candidate:' not in zbx_policy.stdout or 'Candidate: (none)' in zbx_policy.stdout"
  block:
    # 경고(W:)는 대부분 무해하다 — 구식 키 경고나 중복 등록은 저장소가 잘 동작해도 나온다.
    # 실제 실패(E:/Err:)를 우선 보여주고, 없을 때만 경고를 참고로 붙인다.
    - name: 깨진 저장소 파악
      ansible.builtin.shell: |
        set -o pipefail
        out=$(apt-get update 2>&1)
        err=$(printf '%s\n' "$out" | grep -E '^(E:|Err:)' || true)
        [ -n "$err" ] && printf '%s\n' "$err" || printf '%s\n' "$out" | grep -E '^W:' | head -5
      args:
        executable: /bin/bash
      environment:
        LC_ALL: C
      register: apt_errs
      changed_when: false
      failed_when: false
      check_mode: false

    - name: 사유와 함께 중단
      ansible.builtin.fail:
        msg: >-
          {{ inventory_hostname }} — zabbix-agent2 패키지를 조회할 수 없습니다.
          apt 저장소가 깨져 Zabbix 패키지 목록을 받아오지 못한 상태입니다.
          아래 저장소를 먼저 정리하세요 →
          {{ apt_errs.stdout_lines | default(['(apt 오류 출력 없음 — 저장소 등록 자체를 확인하세요)']) | join('  ||  ') }}

# --check 에서는 위 저장소 등록이 실제로 일어나지 않아 이 패키지를 찾을 수 없다.
# 그래서 check 모드에서는 실패를 무시하고 "설치 예정"으로만 남긴다.
- name: zabbix-agent2 설치
  ansible.builtin.apt:
    name: zabbix-agent2
    state: present
    install_recommends: false
    lock_timeout: 300   # unattended-upgrades 가 락을 잡고 있으면 기다린다 (기본 60초로는 부족)
  register: agent_pkg
  ignore_errors: "{{ ansible_check_mode }}"

- name: check 모드 안내
  ansible.builtin.debug:
    msg: >-
      --check 에서는 저장소가 실제로 등록되지 않아 zabbix-agent2 를 조회할 수 없습니다.
      이후 태스크(설정·서비스·검증)도 건너뜁니다. 실제 적용은 --check 없이 실행하세요.
  when:
    - ansible_check_mode
    - agent_pkg is failed

- name: check 모드에서는 여기서 종료
  ansible.builtin.meta: end_host
  when:
    - ansible_check_mode
    - agent_pkg is failed

# Server/ServerActive/Hostname/HostMetadata 는 본 설정 파일에 있어야 한다.
# Hostname 은 OS 호스트명이 아니라 인벤토리 이름(=NetBox 자산명=DNS)을 쓴다.
- name: 에이전트 기본 설정
  ansible.builtin.lineinfile:
    path: /etc/zabbix/zabbix_agent2.conf
    regexp: "^\\s*{{ item.key }}\\s*="   # 주석(# Server=)이 아니라 실제 설정 줄만 매칭
    line: "{{ item.key }}={{ item.value }}"
  loop:
    - { key: "Server",       value: "{{ zabbix_server_allow }}" }
    - { key: "ServerActive", value: "{{ zabbix_server }}" }
    - { key: "Hostname",     value: "{{ inventory_hostname }}" }
    - { key: "HostMetadata", value: "{{ zabbix_host_metadata }}" }
    # 기본 3초로는 mblt-status 처럼 여러 장치를 훑는 UserParameter 가 타임아웃 난다
    - { key: "Timeout",      value: "{{ zabbix_agent_timeout | default(30) }}" }
  loop_control:
    label: "{{ item.key }}"
  notify: restart zabbix-agent2

# ── watch 등록 폼이 남긴 드롭인과 값 맞추기 ────────────────────────────
# /etc/zabbix/zabbix_agent2.d/*.conf 는 Include 로 본 설정보다 **뒤에** 읽힌다.
# 같은 항목이 양쪽에 있으면 드롭인이 이긴다. watch 등록 폼이 만든 ims.conf 에
# 다른 Hostname 이 남아 있으면 여기서 쓴 값이 조용히 무시되고, Zabbix 서버 로그에
# "cannot process heartbeat from host ...: host not found" 가 1분마다 쌓인다.
# 패시브 수집은 IP 로 하니 멀쩡해 보여서 알아채기 어렵다 (2026-09-09 rtpulse).
#
# 지우지 않고 값을 맞춘다 — 어느 쪽이 이기든 결과가 같아야 안전하다.
- name: watch 드롭인 존재 확인
  ansible.builtin.stat:
    path: /etc/zabbix/zabbix_agent2.d/ims.conf
  register: zbx_dropin

- name: 드롭인 값을 본 설정과 맞춤
  ansible.builtin.lineinfile:
    path: /etc/zabbix/zabbix_agent2.d/ims.conf
    regexp: "^\\s*{{ item.key }}\\s*="
    line: "{{ item.key }}={{ item.value }}"
  loop:
    - { key: "Server",       value: "{{ zabbix_server_allow }}" }
    - { key: "ServerActive", value: "{{ zabbix_server }}" }
    - { key: "Hostname",     value: "{{ inventory_hostname }}" }
    - { key: "HostMetadata", value: "{{ zabbix_host_metadata }}" }
    - { key: "Timeout",      value: "{{ zabbix_agent_timeout | default(30) }}" }
  loop_control:
    label: "{{ item.key }}"
  when: zbx_dropin.stat.exists
  notify: restart zabbix-agent2

- name: nvidia-smi 존재 확인
  ansible.builtin.command: which nvidia-smi
  register: nvidia_smi
  changed_when: false
  failed_when: false
  check_mode: false          # 읽기만 하므로 --check 에서도 실행 (안 하면 rc 가 없어 이후 조건이 깨진다)

- name: GPU UserParameter 배포
  ansible.builtin.copy:
    src: nvidia.conf
    dest: /etc/zabbix/zabbix_agent2.d/nvidia.conf
    mode: "0644"
  when: nvidia_smi.rc == 0
  notify: restart zabbix-agent2

# Mobilint ARIES NPU.
# 예전에는 `which mblt-status` 로 판별했는데, 카드를 뽑아도 소프트웨어는 남아
# 있어서 NPU 없는 장비에 UserParameter 를 계속 깔았다 (741GE 에서 실제로 났다 —
# NPU 를 빼고 A5000 4장을 꽂았는데 mblt-status 는 그대로였다).
# 커널 모듈도 판별에 못 쓴다. 두 장비 모두 로드돼 있다.
# /dev 의 장치 노드가 유일하게 갈린다: esc8000 aries0~7 8개, 741GE 0개.
- name: NPU 장치 노드 확인
  ansible.builtin.find:
    paths: /dev
    patterns: 'aries*,mblt*,regulus*'
    file_type: any
  register: npu_dev
  changed_when: false
  check_mode: false

- name: NPU 유무 판정
  ansible.builtin.set_fact:
    mblt_present: "{{ (npu_dev.files | default([]) | length) > 0 }}"

- name: NPU 수집 스크립트 배포
  ansible.builtin.copy:
    src: npu-stats.py
    dest: /etc/zabbix/npu-stats.py
    mode: "0755"
  when: mblt_present | bool
  notify: restart zabbix-agent2

- name: NPU UserParameter 배포
  ansible.builtin.copy:
    src: mobilint.conf
    dest: /etc/zabbix/zabbix_agent2.d/mobilint.conf
    mode: "0644"
  when: mblt_present | bool
  notify: restart zabbix-agent2

- name: NPU 없는 서버에서는 제거
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/zabbix/zabbix_agent2.d/mobilint.conf
    - /etc/zabbix/npu-stats.py
  when: not (mblt_present | bool)
  notify: restart zabbix-agent2

- name: GPU 없는 서버에서는 제거
  ansible.builtin.file:
    path: /etc/zabbix/zabbix_agent2.d/nvidia.conf
    state: absent
  when: nvidia_smi.rc != 0
  notify: restart zabbix-agent2

- name: 서비스 기동 및 부팅 시 자동 시작
  ansible.builtin.systemd:
    name: zabbix-agent2
    state: started
    enabled: true

- name: 설정 반영을 위해 대기 중인 재시작 처리
  ansible.builtin.meta: flush_handlers

# 아래 검증은 에이전트가 실제로 설치된 뒤에만 의미가 있다 (--check 에서는 설치가 안 되므로 건너뛴다)
# ufw 가 켜져 있으면 10050 이 막혀 Zabbix 가 못 붙는다. 에이전트는 정상이라
# 로컬 검증은 통과하고, 서버에서만 timeout 이 나서 원인을 찾기 어렵다.
- name: ufw 활성 여부 확인
  ansible.builtin.command: ufw status
  register: ufw_status
  changed_when: false
  failed_when: false
  check_mode: false

# 허용 주소가 바뀌어도 반영되도록 매번 실행한다.
# '10050 규칙이 이미 있으면 건너뛴다' 로 두면 목록이 바뀌었을 때 낡은 규칙만 남는다
# (실제로 zabbix_server_allow 를 넓혔는데 두 서버에 반영되지 않았다).
# ufw 는 같은 규칙 재추가를 'Skipping adding existing rule' 로 넘기므로 멱등하다.
- name: ufw 에 에이전트 포트 허용
  ansible.builtin.command: >-
    ufw allow from {{ item }} to any port 10050 proto tcp
  loop: "{{ zabbix_server_allow.split(',') | map('trim') | list }}"
  when:
    - ufw_status.rc == 0
    - "'inactive' not in ufw_status.stdout"
  register: ufw_added
  changed_when: "'Skipping' not in (ufw_added.stdout | default(''))"

- name: ufw 규칙 추가 안내
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }} — ufw 10050 허용: {{ zabbix_server_allow }}"
  when: ufw_added is changed

- name: 동작 확인
  ansible.builtin.command: zabbix_agent2 -t agent.ping
  register: agent_ping
  changed_when: false
  when: not ansible_check_mode

# 로컬 'zabbix_agent2 -t' 는 에이전트 내부만 본다. Zabbix 가 쓰는 경로(네트워크)를
# 확인하려면 컨트롤러에서 직접 붙어봐야 한다 — ufw 문제가 여기서 드러난다.
- name: 컨트롤러에서 에이전트 포트 접속 확인
  ansible.builtin.wait_for:
    host: "{{ ansible_host | default(inventory_hostname) }}"
    port: 10050
    timeout: 5
    state: started
  delegate_to: localhost
  become: false
  # localhost 로 위임하면 호스트 변수가 따라가지 않아 group_vars 의
  # become_passwords[inventory_hostname] | mandatory 가 다시 평가된다.
  # vault.yml 에 없는 호스트(sudo NOPASSWD)는 여기서 멈춘다. become 을 쓰지
  # 않는 태스크이므로 빈 값으로 덮는다.
  vars:
    ansible_become_password: ""
  register: port_check
  failed_when: false
  check_mode: false

- name: 포트 접속 실패 안내
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }} — 컨트롤러에서 10050 접속이 안 됩니다.
      에이전트는 동작 중이니 방화벽이나 경로를 확인하세요. Zabbix 수집은 실패합니다.
  when: port_check.failed | default(false) or port_check.state is not defined

- name: GPU 수집 확인
  ansible.builtin.command: zabbix_agent2 -t gpu.discovery
  register: gpu_test
  changed_when: false
  failed_when: false
  when:
    - not ansible_check_mode
    - nvidia_smi.rc == 0

- name: 결과
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }} ({{ ansible_distribution }} {{ ansible_distribution_version }})
      — GPU {{ '있음' if nvidia_smi.rc == 0 else '없음' }}
      {{ '' if ansible_check_mode else
         ' / agent.ping ' + ('OK' if '[s|1]' in (agent_ping.stdout | default('')) else 'FAIL') }}
      {{ (gpu_test.stdout | default('') | truncate(60)) if (nvidia_smi.rc == 0 and not ansible_check_mode) else '' }}
