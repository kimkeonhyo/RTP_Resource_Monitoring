---
# 사내망 안에 있으면서 tailscale 노드이기도 한 호스트가 --accept-routes 를 켜면,
# dev-gpu01 이 광고하는 <OFFICE_SUBNET_CIDR> 이 라우팅 테이블 52 에 들어간다.
# ip rule 의 `5270: lookup 52` 가 `32766: lookup main` 보다 먼저 조회되므로
# 사내망으로 나가는 응답이 eno1 대신 tailscale0 으로 새어나가고,
# dev-gpu01 이 SNAT 한 요청의 응답이 다른 경로로 돌아오면서 conntrack 이 안 맞아
# 폐기된다. 결과는 "서버는 멀쩡한데 밖에서만 안 닿는다" 다.
#
# 2026-09-07 ai-gpu04, 2026-09-08 ws-02 에서 같은 원인으로 장애가 났다.
# ws-02 는 cron 이 매일 05:55 에 `tailscale up` 을 돌려 3일 이상 반복됐다.
#
# 판별 단서: 같은 서버가 테일넷 주소로는 응답하고 사내망 주소로는 안 된다.

- name: tailscale 설치 여부 확인
  ansible.builtin.stat:
    path: /usr/bin/tailscale
  register: ts_bin

- name: 설치 안 된 호스트는 여기서 끝
  ansible.builtin.meta: end_host
  when: not ts_bin.stat.exists

- name: 이 호스트가 사내망 안에 있는지 확인
  ansible.builtin.set_fact:
    ts_in_lan: >-
      {{ ansible_all_ipv4_addresses
         | select('ansible.utils.in_network', tailscale_lan_cidr)
         | list | length > 0 }}

# 사내망 밖(고객사 등)은 이 대역 경로를 받아야 하므로 손대지 않는다.
- name: 사내망 밖 호스트는 건너뜀
  ansible.builtin.meta: end_host
  when: not (ts_in_lan | bool)

- name: 서브넷 라우터는 진단만 하고 수정하지 않는다
  ansible.builtin.set_fact:
    ts_skip_fix: "{{ inventory_hostname in tailscale_skip_hosts }}"

- name: 저장된 prefs 조회
  ansible.builtin.command:
    argv: [/usr/bin/tailscale, debug, prefs]
  register: ts_prefs
  changed_when: false
  failed_when: false
  check_mode: false

- name: prefs 를 못 읽으면 안내만 남긴다
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: tailscale debug prefs 실패
      (rc={{ ts_prefs.rc }}) — {{ (ts_prefs.stderr | default(''))[:120] }}
  when: ts_prefs.rc != 0

- name: 여기서 끝 (prefs 못 읽음)
  ansible.builtin.meta: end_host
  when: ts_prefs.rc != 0

- name: RouteAll 값 추출
  ansible.builtin.set_fact:
    ts_route_all: "{{ (ts_prefs.stdout | from_json).RouteAll | default(false) | bool }}"
    ts_want_running: "{{ (ts_prefs.stdout | from_json).WantRunning | default(false) | bool }}"

# 지금 켜져 있는 상태라면 실제로 경로가 들어갔는지도 본다.
- name: 테이블 52 에 사내망 경로가 실제로 있는지 확인
  ansible.builtin.shell:
    cmd: "ip route show table {{ tailscale_table }} | grep -F '{{ tailscale_lan_cidr }}' || true"
  register: ts_route
  changed_when: false
  check_mode: false

- name: 진단 결과
  ansible.builtin.debug:
    msg: >-
      accept-routes={{ 'ON  ← 고쳐야 함' if ts_route_all else 'off' }},
      tailscale={{ '실행중' if ts_want_running else '중지' }},
      table {{ tailscale_table }} 의 {{ tailscale_lan_cidr }}={{ '있음 ← 지금 새고 있다' if ts_route.stdout else '없음' }}

# cron 이 `tailscale up` 을 돌리면 정상으로 돌려놔도 다시 켜질 수 있다.
# 인자 없는 `tailscale up` 은 저장된 prefs 를 재사용하므로 accept-routes 를 끄면
# 안전하지만, 플래그를 붙여 부르는 경우가 있어 찾아서 알려준다.
# 원격 쉘에서 grep 으로 거르면 브레이스 그룹 때문인지 필터가 먹지 않아
# crontab 전문이 통째로 올라왔다. 덤프만 받아 와서 여기서 거른다.
- name: cron 덤프 수집
  ansible.builtin.shell:
    cmd: "cat /etc/crontab /etc/cron.d/* 2>/dev/null; crontab -l 2>/dev/null; crontab -l -u root 2>/dev/null"
  register: ts_cron
  changed_when: false
  failed_when: false
  check_mode: false

- name: tailscale 을 부르는 줄만 추린다
  ansible.builtin.set_fact:
    ts_cron_hits: >-
      {{ ts_cron.stdout_lines | default([])
         | reject('match', '^\\s*#') | reject('match', '^\\s*$')
         | select('search', 'tailscale') | list }}

- name: cron 이 tailscale 을 부르고 있음
  ansible.builtin.debug:
    msg: "{{ ts_cron_hits }}"
  when: ts_cron_hits | length > 0

# ── 수정 ────────────────────────────────────────────────────────────────
- name: accept-routes 끄기
  ansible.builtin.command:
    argv: [/usr/bin/tailscale, set, --accept-routes=false]
  when:
    - tailscale_fix | bool
    - ts_route_all | bool
    - not (ts_skip_fix | bool)
  register: ts_set

- name: 끈 뒤 다시 확인
  ansible.builtin.command:
    argv: [/usr/bin/tailscale, debug, prefs]
  register: ts_prefs2
  changed_when: false
  check_mode: false
  when:
    - tailscale_fix | bool
    - ts_route_all | bool
    - not (ts_skip_fix | bool)

- name: 반영 확인
  ansible.builtin.assert:
    that: not ((ts_prefs2.stdout | from_json).RouteAll | default(false) | bool)
    success_msg: "accept-routes 를 껐다. 다음 tailscale up 에서도 사내망 경로를 받지 않는다."
    fail_msg: "accept-routes 가 여전히 켜져 있다 — 수동 확인이 필요하다."
  when:
    - tailscale_fix | bool
    - ts_route_all | bool
    - not (ts_skip_fix | bool)

- name: 결과
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}:
      {{ '서브넷 라우터라 제외 (accept-routes ON 이지만 자기 광고 경로는 안 받아 증상 없음)'
         if (ts_skip_fix | bool and ts_route_all | bool)
         else ('수정 완료 (accept-routes off)' if (tailscale_fix | bool and ts_route_all | bool)
         else ('조치 필요 — -e tailscale_fix=true 로 다시 실행' if ts_route_all
               else '정상')) }}
