# IMS 서버 인벤토리 (2026-08-28)
#
# 호스트명 = NetBox 자산명 = DNS 이름. Zabbix 호스트명도 이 값으로 등록됩니다.
# NetBox 이름에 공백·괄호가 있어 DNS로 쓸 수 없는 장비는 슬러그로 바꾸고 asset_name 에 원래 이름을 남깁니다.
#   os_hostname : 서버 내부 호스트명 (gpusystem 이 3대 중복이라 식별자로 못 씀)
#   spec        : 담당자 표의 서술적 명칭

[gpu_dev]
dev-gpu01   ansible_host=<DEV_GPU01_IP>  ansible_user=ops       ansible_port=22    os_hostname=<OS_HOSTNAME>                spec=blackwell-4000pro-4ea-dev
dev-gpu02   ansible_host=<DEV_GPU02_IP>  ansible_user=ops       ansible_port=22    os_hostname=<OS_HOSTNAME>                    spec=a5000-4ea-dev
dev-gpu03   ansible_host=<DEV_GPU03_IP>  ansible_user=ops       ansible_port=22    os_hostname=<OS_HOSTNAME>              spec=a5000-2ea-4000pro-2ea
dev-gpu04   ansible_host=<DEV_GPU04_IP>  ansible_user=ops       ansible_port=22    os_hostname=<OS_HOSTNAME>              spec=a5000-3ea-dev

[gpu_ai]
ai-gpu01    ansible_host=<AI_GPU01_IP>  ansible_user=ops       ansible_port=22    os_hostname=<OS_HOSTNAME>          spec=a5000-2ea-ai
ai-gpu02    ansible_host=<AI_GPU02_IP>  ansible_user=wsa6000 ansible_port=33335 os_hostname=<OS_HOSTNAME>            spec=a6000-2ea-ai
#ai-gpu03    ansible_host=<AI_GPU03_IP>  ansible_user=ops       ansible_port=33340 os_hostname=<OS_HOSTNAME>                    spec=h100-3ea-ai
ai-gpu04    ansible_host=<AI_GPU04_IP>  ansible_user=gpuadmin  ansible_port=33330 os_hostname=<OS_HOSTNAME>              spec=media-server-dev

[etc_servers]
inf-gpu01     ansible_host=<INF_GPU01_IP>  ansible_user=gpuadmin ansible_port=22   os_hostname=<OS_HOSTNAME>   spec=rtx6000pro
inf-gpu02     ansible_host=<INF_GPU02_IP> ansible_user=ops      ansible_port=22   os_hostname=<OS_HOSTNAME>       spec=rtx6000pro-2ea
dev-storage01 ansible_host=<DEV_STORAGE01_IP>  ansible_user=ops      ansible_port=22   os_hostname=<OS_HOSTNAME>      spec=data-lake-dev
# sudo 가 NOPASSWD 라 vault.yml 에 항목이 없다. 호스트 변수가 group_vars 의
# mandatory 를 덮어 "vault.yml 에 없다" 로 멈추지 않게 한다. 빈 값은 모른다는 뜻이
# 아니라 sudo 가 묻지 않는다는 뜻이다.
GPU-server-741GE-TNRT       ansible_host=<GPU741_IP> ansible_user=gpuadmin ansible_port=22    os_hostname=<OS_HOSTNAME>             asset_name="GPU Server 741GE-TNRT (tower)" ansible_become_password=""
# 납품 예정. tailscaled 는 의도적으로 비활성(disabled)이므로 켜거나 mask 하지 말 것.
# 그래서 check-tailscale-routes 에서 "prefs 못 읽음" 으로 나오는 것이 정상이다.
# 납품 시 사내망을 벗어나면 accept-routes 판단이 반대가 된다 — remote_site 로 옮긴다.
# os_hostname 은 gpusystem 이다 (dev-gpu04·ai-gpu04·inf-gpu01·npu-8ea 와 중복).
esc8000       ansible_host=<ESC8000_IP>  ansible_user=gpuadmin ansible_port=22   os_hostname=<OS_HOSTNAME>   asset_name="ASUS 4U Server ESC8000-E12"
h200          ansible_host=<H200_IP>  ansible_user=gpuadmin ansible_port=22   asset_name="h200"        spec=h200-3ea
[workstations]
dev-media01 ansible_host=<DEV_MEDIA01_IP>  ansible_user=ops        ansible_port=22 
#ws-07      ansible_host=<WS07_IP>  ansible_user=user07  ansible_port=22   asset_name="WS (07)"

[remote_site]
site-a       ansible_host=<SITE_A_TAILNET_IP> ansible_user=ops    ansible_port=22
site-b        ansible_host=<SITE_B_TAILNET_IP> ansible_user=ops    ansible_port=22
site-c      ansible_host=<SITE_C_TAILNET_IP> ansible_user=ops    ansible_port=22
site-d    ansible_host=<SITE_D_TAILNET_IP> ansible_user=ops    ansible_port=22
site-e      ansible_host=<SITE_E_TAILNET_IP> ansible_user=ops    ansible_port=22
site-f         ansible_host=<SITE_F_TAILNET_IP> ansible_user=ops    ansible_port=22

[personal_servers]
ws-01      ansible_host=<WS01_IP>  ansible_user=gpuadmin  ansible_port=22   asset_name="WS (01)"
ws-02      ansible_host=<WS02_IP>  ansible_user=ops  ansible_port=22   asset_name="WS (02)"
ws-03      ansible_host=<WS03_IP>  ansible_user=ops  ansible_port=22   asset_name="WS (03)"
ws-04      ansible_host=<WS04_IP>  ansible_user=user04  ansible_port=2222   asset_name="WS (04)"
ws-05      ansible_host=<WS05_IP>  ansible_user=gpuadmin  ansible_port=22   asset_name="WS (05)"
ws-06      ansible_host=<WS06_IP>   ansible_user=user06  ansible_port=22   asset_name="WS (06)"
ws-07      ansible_host=<WS07_IP>  ansible_user=user07  ansible_port=22   asset_name="WS (07)"

[nas]
nas01   ansible_host=<NAS01_IP> ansible_user=admin    ansible_port=22
nas02   ansible_host=<NAS02_TAILNET_IP> ansible_user=nasadmin    ansible_port=22
nas03   ansible_host=<NAS03_TAILNET_IP> ansible_user=nas32_admin    ansible_port=22
# ai-gpu01 / npu-8ea : 네트워크 무응답 — 확인 후 ims 그룹으로 옮긴다
# ai-gpu03 (h100-3ea-ai) : 2026-08-28 철거 완료
[unreachable]
# ai-gpu01    ansible_host=<AI_GPU01_IP>  ansible_user=ops      ansible_port=22    os_hostname=<OS_HOSTNAME>         spec=a5000-2ea-ai


[ims:children]
gpu_dev
gpu_ai
etc_servers
workstations
remote_site
personal_servers
