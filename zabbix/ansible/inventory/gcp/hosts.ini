# GCP VM (project demo-infra). 사내 인벤토리와 갈라 둔 이유:
#   · GCP VM 은 OS Login 으로 sudo NOPASSWD 라 become 비밀번호가 없다
#     (ims 의 group_vars/all 은 vault 비밀번호를 mandatory 로 요구한다)
#   · Server= 허용 주소와 HostMetadata 가 다르다
#
# 별칭이 Zabbix 호스트명이 된다. GCP VM 이름에는 재생성 때 바뀌는 난수 접미사가
# 붙으므로(demo-infra-platform-rtpulse-xxxx) 그대로 쓰지 않는다.
#
# ⚠ 인증 체계가 두 가지로 섞여 있다. VM 메타데이터 enable-oslogin 값으로 갈린다.
#
#   TRUE  (20대) → OS Login. 계정은 infra_example_com (gcloud 계정 infra@example.com).
#                  프로젝트 메타데이터 ssh-keys 는 무시되므로, 키를 OS Login 프로필에
#                  등록해야 한다. 한 번 등록하면 프로젝트 전체 VM 에 적용된다:
#                    gcloud compute os-login ssh-keys add --project=demo-infra \
#                      --key-file=~/.ssh/id_ed25519.pub
#   FALSE (ims, zabbix) → 프로젝트 메타데이터 ssh-keys. 계정은 키 이름(deploy)이고
#                  키는 ~/.ssh/google_compute_engine 이다. 아래에서 호스트별로 덮어쓴다.
#
# 확인:
#   gcloud compute instances describe <VM> --zone=asia-northeast3-a --project=demo-infra \
#     --format="value(metadata.items.filter(\"key:enable-oslogin\").extract(\"value\"))"
#
# 목록 갱신:
#   gcloud compute instances list --project=demo-infra \
#     --format="table[no-heading](name,networkInterfaces[0].networkIP,status,disks[0].licenses[0].basename())"
#
# 실행:
#   ansible-playbook -i inventory/gcp/hosts.ini playbooks/install-zabbix-cloud.yml

[gcp_o11y]
central-metrics  ansible_host=<CENTRAL_METRICS_IP>

[gcp_platform]
bot-exec         ansible_host=<BOT_EXEC_IP>
bot-kb           ansible_host=<BOT_KB_IP>
derp-kr          ansible_host=<DERP_KR_IP>
# 2026-09-30 MIG 가 인스턴스를 재생성(demo-infra-platform-hs)해 주소가 바뀌었다.
# 부팅 디스크가 새것이라 에이전트도 다시 깔았다.
headscale        ansible_host=<HEADSCALE_IP>
# ims 은 enable-oslogin=FALSE — 메타데이터 키 체계라 계정·키가 다르다
ims             ansible_host=<IMS_IP>  ansible_user=deploy  ansible_ssh_private_key_file=~/.ssh/google_compute_engine
vms-demo-relay  ansible_host=<VMS_DEMO_RELAY_IP>
demo-cx           ansible_host=<DEMO_CX_IP>
rtpulse         ansible_host=<RTPULSE_IP>
quoto-gen        ansible_host=<QUOTO_GEN_IP>
tsr              ansible_host=<TSR_IP>
vaultwarden      ansible_host=<VAULTWARDEN_IP>
weknora          ansible_host=<WEKNORA_IP>

# 테일넷 경로(내 Mac → tsr → VPC)에서 ICMP·22 둘 다 안 닿는다. VM 은 RUNNING 이고
# demo-infra-vpc-allow-internal(<GCP_VPC_CIDR> → 전 포트)이 열려 있으므로 VPC 방화벽은
# 아니다. VM 안쪽 방화벽이 IAP 대역만 허용하는 것으로 보인다(미검증).
# IAP 터널로 붙이려면 ProxyCommand 가 필요하다 — 인스턴스 이름이 있어야 한다:
#   -o ProxyCommand="gcloud compute start-iap-tunnel %h %p --listen-on-stdin
#      --project=demo-infra --zone=asia-northeast3-a"
# Zabbix 서버(<ZABBIX_SERVER_IP>)는 같은 VPC 안이라 에이전트만 깔리면 수집은 된다.
[gcp_iap_only]
n8n              ansible_host=<N8N_IP>
vms-cloud       ansible_host=<VMS_CLOUD_IP>

[gcp:children]
gcp_o11y
gcp_platform

[gcp:vars]
# OS Login 계정명 = gcloud 계정의 @·. 을 _ 로 바꾼 것 (infra@example.com).
# 다른 계정으로 붙으려면 실행할 때 -u 로 덮어쓴다.
ansible_user=infra_example_com

# ── 제외 ────────────────────────────────────────────────────────────────
# COS(Container-Optimized OS) — 패키지 매니저가 없어 에이전트를 깔 수 없다.
# ICMP·HTTP 체크로 보거나 컨테이너 에이전트를 따로 띄워야 한다.
#   gatus       <GATUS_IP>
#   infisical   <INFISICAL_IP>
#
# 다른 VPC·리전 — <ZABBIX_SERVER_IP> 으로 가는 경로가 없다. 피어링/경로를 먼저 확인해야
# 하고, Server= 에 SNAT 주소를 더해야 할 수도 있다 (사내망과 같은 구조).
#   vms-production  <VMS_PRODUCTION_IP>   (Ubuntu 24.04)
#   derp-th          <DERP_TH_IP>   (Rocky 10, asia-southeast1)
#
# Zabbix 서버 자신. 컨테이너로 도는 서버와 호스트 에이전트가 같은 이름으로
# 등록되면 헷갈린다. 호스트 지표가 필요하면 별칭을 분명히 갈라 붙인다.
# (이 VM 도 enable-oslogin=FALSE 라 넣을 때 ims 처럼 계정·키를 덮어써야 한다)
#   zabbix      <ZABBIX_SERVER_IP>
#
# TERMINATED — 켜지면 다시 넣는다.
#   gbrain-poc  <GBRAIN_POC_IP>
#   bastion     <BASTION_IP>
