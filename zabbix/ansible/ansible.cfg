[defaults]
inventory            = inventory/ims/hosts.ini
roles_path           = roles
interpreter_python   = auto_silent
stdout_callback      = default
result_format        = yaml   ; community.general.yaml 콜백이 제거되어 코어 옵션으로 대체
forks                = 10
deprecation_warnings = False

[ssh_connection]
pipelining = True
